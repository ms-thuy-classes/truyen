<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết truyện - Pastel Stories</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="container header__inner">
                <a href="index.html" class="logo"><i class="fas fa-book-open"></i> <span>Pastel Stories</span></a>
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Tìm truyện...">
                </div>
                <button class="btn-icon" id="darkModeToggle"><i class="fas fa-moon"></i></button>
            </div>
        </header>
        <main class="main">
            <div class="container">
                <div id="storyDetail" class="story-detail">Đang tải thông tin truyện...</div>
                <div class="chapters-section">
                    <h2>📖 Danh sách chương</h2>
                    <div id="chaptersList">Đang tải danh sách chương...</div>
                </div>
            </div>
        </main>
        <footer class="footer"><div class="container"><p>🌸 Pastel Stories – Đọc truyện online nhẹ nhàng</p></div></footer>
    </div>

    <script src="js/data.js"></script>
    <script src="js/story.js"></script>
</body>
</html>

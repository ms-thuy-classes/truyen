<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang đọc truyện - Pastel Stories</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Override cho trang đọc */
        .reader-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        .chapter-title {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 1rem;
            text-align: center;
        }
        .chapter-content {
            font-size: 1.2rem;
            line-height: 1.8;
            color: var(--text-color);
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 28px;
            box-shadow: var(--shadow-sm);
            margin-top: 2rem;
        }
        .chapter-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
            gap: 1rem;
        }
        .nav-btn {
            background: var(--pastel-mint);
            color: var(--soft-brown);
            padding: 0.75rem 1.5rem;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s;
        }
        .nav-btn:hover {
            background: var(--pastel-pink);
            transform: translateY(-2px);
        }
        .progress-save {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="container header__inner">
                <a href="index.html" class="logo">
                    <i class="fas fa-book-open"></i> 
                    <span>Pastel Stories</span>
                </a>
                <button class="btn-icon" id="darkModeToggle">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </header>

        <main class="main">
            <div class="reader-container" id="readerContainer">
                <div class="loading">Đang tải nội dung chương...</div>
            </div>
        </main>

        <footer class="footer">
            <div class="container">
                <p>🌸 Pastel Stories – Thiết kế tối giản, tập trung vào trải nghiệm đọc</p>
            </div>
        </footer>
    </div>

    <script src="js/data.js"></script>
    <script src="js/read.js"></script>
</body>
</html>
